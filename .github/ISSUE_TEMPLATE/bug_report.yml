name: Bug report
description: Something in Blooby does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        A few details up front save a lot of back and forth.

        If this is a **security** problem, please do not file it here.
        See [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Blooby
        2. Run `claude` in a terminal
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Blooby version
      description: Visible in Settings, or in the tray menu.
      placeholder: "1.30.42"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a short screen recording help a lot here.
    validations:
      required: false
